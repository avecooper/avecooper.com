<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="a1-svg-title a1-svg-description">
  <title id="a1-svg-title">Job Radar system overview</title>
  <desc id="a1-svg-description">Diagram showing career pages flowing into Search on a private server, a verified read-only copy flowing to Application Prep on a Mac, and only a minimal engagement summary returning to Search. Human decisions remain separate.</desc>
  <defs>
    <marker id="a1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink, #1c1c1a)"/></marker>
  </defs>
  <g font-family="'Inter Variable', Inter, system-ui, sans-serif" font-size="24" fill="var(--color-ink, #1c1c1a)">
    <text x="24" y="32">Career pages</text>
    <path d="M 208 24 H 240 V 72" fill="none" stroke="var(--color-ink, #1c1c1a)" stroke-width="2" marker-end="url(#a1-arrow)"/>
    <g fill="none" stroke="var(--color-rule, #c9cbc3)">
      <rect x="24" y="84" width="432" height="278"/>
      <rect x="504" y="84" width="432" height="278"/>
      <path d="M 48 252 H 432 M 528 252 H 912"/>
    </g>
    <g font-weight="650">
      <text x="48" y="122">Search on private server</text>
      <text x="528" y="122">Application Prep on Mac</text>
    </g>
    <text x="48" y="166">Monitor and preserve history</text>
    <text x="48" y="204">Evaluate matches automatically</text>
    <text x="48" y="242">Contextual Search alerts</text>
    <text x="528" y="166">Research</text>
    <text x="528" y="204">Prepare materials</text>
    <text x="528" y="242">Track activity</text>
    <g fill="var(--color-accent, #155b58)" font-weight="650">
      <text x="48" y="290">I decide: Evaluate</text>
      <text x="48" y="328">Choose to pursue</text>
      <text x="528" y="290">I decide: Approve facts</text>
      <text x="528" y="328">Approve materials · Submit</text>
    </g>
    <g fill="none" stroke="var(--color-ink, #1c1c1a)" stroke-width="2" marker-end="url(#a1-arrow)">
      <path d="M 408 362 V 426 H 552 V 362"/>
      <path d="M 888 362 V 510 H 72 V 362"/>
    </g>
    <rect x="176" y="386" width="608" height="36" fill="var(--color-paper, #f8f6f0)"/>
    <text x="480" y="412" text-anchor="middle" font-weight="650">Search → Mac: Verified read-only copy</text>
    <rect x="128" y="468" width="704" height="36" fill="var(--color-paper, #f8f6f0)"/>
    <text x="480" y="494" text-anchor="middle" font-weight="650">Mac → Search: Only a minimal engagement summary</text>
    <text x="480" y="556" text-anchor="middle">Future Search alerts gain relevant context.</text>
    <text x="480" y="598" text-anchor="middle" fill="var(--color-muted, #4f5551)">Private career evidence stays on the Mac. Submission is human.</text>
  </g>
</svg>
